name: CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social-music-beat-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows 11
            os: windows-latest
          - platform: Linux
            os: ubuntu-latest
          - platform: macOS Intel
            os: macos-15-intel
          - platform: macOS Apple Silicon
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Show platform and architecture
        run: python -c "import platform, sys; print(sys.platform, platform.machine(), sys.version)"
      - name: Install API test dependencies
        run: python -m pip install fastapi httpx python-multipart keyring
      - name: Validate Windows PowerShell installer scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $files = @("helper/install_acestep.ps1", "helper/storage_manager.ps1")
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List
              exit 1
            }
            Write-Host "PowerShell syntax OK: $file"
          }
      - name: Compile Python sources
        run: python -m compileall -q helper
      - name: Test local AI manager and cloud providers
        working-directory: helper
        run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interface-fonte
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Commit compiled interface on development branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/ia-local-compositor' && github.actor != 'github-actions[bot]'
        run: |
          git -C .. config user.name "github-actions[bot]"
          git -C .. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .. add helper/web
          if ! git -C .. diff --cached --quiet; then
            git -C .. commit -m "Build compiled Social Music Beat interface"
            git -C .. push
          fi
